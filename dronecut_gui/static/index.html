<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DroneCut | Intelligent Drone Editor</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
</head>
<body class="dark-theme">
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-container">
                <h1 class="logo">Drone<span>Cut</span></h1>
                <p class="tagline">Cinematic AI Editing</p>
            </div>

            <nav class="config-panel">
                <div class="input-group">
                    <label>Video Sorgenti</label>
                    <div class="input-with-btn">
                        <input type="text" id="video-paths" placeholder="file1.mp4, file2.mp4...">
                        <button id="btn-browse-videos" class="btn-small">Sfoglia</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Musica (Opzionale)</label>
                    <div class="input-with-btn">
                        <input type="text" id="music-path" placeholder="audio.mp3">
                        <button id="btn-browse-music" class="btn-small">Sfoglia</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Prompt Positivi</label>
                    <textarea id="positive-prompts" rows="3">cinematic drone photography, spectacular landscape</textarea>
                </div>

                <div class="input-group">
                    <label>Prompt Negativi</label>
                    <textarea id="negative-prompts" rows="2" placeholder="van, people, close-up..."></textarea>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Velocità Base</label>
                        <input type="number" id="base-speed" value="1.5" step="0.1">
                    </div>
                    <div class="input-group">
                        <label>Soglia Cut</label>
                        <input type="number" id="threshold" value="20.0">
                    </div>
                </div>

                <div class="row">
                    <div class="input-group">
                        <label>Max Scene</label>
                        <input type="number" id="max-scenes" value="40">
                    </div>
                    <div class="input-group">
                        <label>Min Durata (s)</label>
                        <input type="number" id="min-duration" value="1.5" step="0.5">
                    </div>
                </div>

                <div class="input-group">
                    <label>Durata Finale Max (sec)</label>
                    <input type="number" id="max-duration" placeholder="Esempio: 60">
                </div>

                <button id="btn-analyze" class="btn-primary">Inizia Analisi AI</button>
            </nav>

            <div class="status-bar" id="status-bar">
                Pronto per l'analisi
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <h2>Review Timeline</h2>
                <div class="header-actions">
                    <span id="scene-count" class="badge">0 Scene Trovate</span>
                    <button id="btn-export" class="btn-success" disabled>Esporta Risultato</button>
                </div>
            </header>

            <div id="timeline" class="timeline-grid">
                <div class="empty-state">
                    <div class="icon">🎬</div>
                    <h3>Nessuna scena analizzata</h3>
                    <p>Configura i parametri a sinistra e avvia l'analisi per vedere le anteprime qui.</p>
                </div>
            </div>

            <div id="loading-overlay" class="overlay hidden">
                <div class="loader"></div>
                <p id="loading-text">Analisi dei video in corso...</p>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
